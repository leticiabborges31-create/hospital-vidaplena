spring.application.name=api
server.error.include-message=always

spring.datasource.url=jdbc:postgresql://localhost:5432/vidaplena
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT. Em producao defina a variavel de ambiente JWT_SECRET (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:dev-chave-local-troque-em-producao-0123456789}
app.jwt.expiracao-horas=8

# Administrador criado na primeira execucao. Em producao defina ADMIN_SENHA com uma senha forte.
app.admin.usuario=admin
app.admin.senha=${ADMIN_SENHA:vidaplena123}
