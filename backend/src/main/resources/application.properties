spring.application.name=api
# A hospedagem define a porta pela variavel PORT.
server.port=${PORT:8080}
server.error.include-message=always

# Banco: local por padrao. Na nuvem defina DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vidaplena}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT. Em producao defina a variavel de ambiente JWT_SECRET (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:dev-chave-local-troque-em-producao-0123456789}
app.jwt.expiracao-horas=8

# Administrador criado na primeira execucao. Em producao defina ADMIN_SENHA com uma senha forte.
app.admin.usuario=admin
app.admin.senha=${ADMIN_SENHA:vidaplena123}

# Endereco(s) do site liberados no CORS, separados por virgula. Na nuvem: o endereco da Vercel.
app.cors.origem=${CORS_ORIGEM:http://localhost:5173}
